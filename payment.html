<!DOCTYPE html>

<html>

<head>


<meta charset="UTF-8">

<title>Payment - FoodieExpress</title>

<style>

    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: linear-gradient(135deg, #fff1eb, #ffe4f0, #eee5ff);
        min-height: 100vh;
        color: #333;
    }

    /* NAVBAR */

    .navbar {
        height: 70px;
        background: linear-gradient(90deg, #ff512f, #dd2476);
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 60px;
        color: white;
        box-shadow: 0 5px 20px rgba(0,0,0,0.15);
    }

    .logo {
        font-size: 25px;
        font-weight: bold;
    }

    .nav-links {
        display: flex;
        gap: 25px;
    }

    .nav-links a {
        color: white;
        text-decoration: none;
        font-weight: bold;
    }

    .nav-links a:hover {
        color: #ffe082;
    }

    /* MAIN */

    .container {
        width: 90%;
        max-width: 1000px;
        margin: 45px auto;
    }

    .heading {
        text-align: center;
        margin-bottom: 30px;
    }

    .heading h1 {
        font-size: 40px;
        margin: 0;
        background: linear-gradient(90deg, #ff512f, #dd2476, #7b2ff7);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
    }

    .heading p {
        color: #777;
        font-size: 17px;
    }

    /* PAYMENT BOX */

    .payment-container {
        background: white;
        border-radius: 22px;
        padding: 35px;
        box-shadow: 0 12px 30px rgba(0,0,0,0.12);
    }

    .section-title {
        color: #dd2476;
        margin-bottom: 20px;
        border-bottom: 2px solid #eee;
        padding-bottom: 10px;
    }

    /* FORM */

    .form-group {
        margin-bottom: 18px;
    }

    .form-group label {
        display: block;
        font-weight: bold;
        margin-bottom: 7px;
    }

    .form-group input,
    .form-group select {
        width: 100%;
        padding: 13px;
        border: 1px solid #ddd;
        border-radius: 10px;
        font-size: 15px;
        outline: none;
    }

    .form-group input:focus,
    .form-group select:focus {
        border-color: #dd2476;
    }

    /* PAYMENT METHODS */

    .payment-methods {
        display: flex;
        gap: 15px;
        flex-wrap: wrap;
        margin-bottom: 25px;
    }

    .payment-option {
        flex: 1;
        min-width: 150px;
        border: 2px solid #eee;
        border-radius: 12px;
        padding: 15px;
        text-align: center;
        cursor: pointer;
    }

    .payment-option:hover {
        border-color: #dd2476;
        background: #fff4f8;
    }

    .payment-option input {
        margin-right: 8px;
    }

    /* TOTAL */

    .total-box {
        margin-top: 25px;
        padding: 20px;
        border-radius: 15px;
        background: linear-gradient(135deg, #fff1eb, #ffe4f0);
        text-align: right;
    }

    .total-box h2 {
        margin: 0;
        color: #777;
    }

    .total {
        font-size: 32px;
        font-weight: bold;
        color: #ff512f;
        margin-top: 5px;
    }

    /* BUTTON */

    .place-order {
        width: 100%;
        margin-top: 25px;
        padding: 16px;
        border: none;
        border-radius: 30px;
        background: linear-gradient(135deg, #ff512f, #dd2476);
        color: white;
        font-size: 18px;
        font-weight: bold;
        cursor: pointer;
    }

    .place-order:hover {
        opacity: 0.9;
    }

    .back-cart {
        display: block;
        text-align: center;
        margin-top: 20px;
        color: #7b2ff7;
        text-decoration: none;
        font-weight: bold;
    }

    @media(max-width: 700px) {

        .navbar {
            padding: 0 20px;
        }

        .nav-links {
            gap: 10px;
        }

        .nav-links a {
            font-size: 12px;
        }

        .payment-container {
            padding: 20px;
        }
    }

</style>

</head>

<body>

```
<!-- NAVBAR -->

<div class="navbar">

    <div class="logo">
        FoodieExpress
    </div>

    <div class="nav-links">

        <a href="home.html">Home</a>

        <a href="profile">Profile</a>

        <a href="cart">Cart</a>

       <a href="orderHistory">Orders</a>

       <a href="logout">Logout</a>

    </div>

</div>


<!-- MAIN -->

<div class="container">

    <div class="heading">

        <h1>Payment</h1>

        <p>
            Complete your order and enjoy your delicious food!
        </p>

    </div>


    <div class="payment-container">


        <!-- IMPORTANT:
             FORM STARTS HERE
             So all details will be sent to PlaceOrderServlet
        -->

        <form action="placeOrder" method="post">


            <!-- DELIVERY DETAILS -->

            <h2 class="section-title">
                Delivery Details
            </h2>


            <div class="form-group">

                <label>Full Name</label>

                <input
                    type="text"
                    name="name"
                    placeholder="Enter your name"
                    required>

            </div>


            <div class="form-group">

                <label>Phone Number</label>

                <input
                    type="text"
                    name="phone"
                    placeholder="Enter your phone number"
                    required>

            </div>


            <div class="form-group">

                <label>Delivery Address</label>

                <input
                    type="text"
                    name="address"
                    placeholder="Enter your delivery address"
                    required>

            </div>


            <!-- PAYMENT METHOD -->

            <h2 class="section-title">
                Payment Method
            </h2>


            <div class="payment-methods">

                <label class="payment-option">

                    <input
                        type="radio"
                        name="paymentMethod"
                        value="UPI"
                        required>

                    UPI

                </label>


                <label class="payment-option">

                    <input
                        type="radio"
                        name="paymentMethod"
                        value="Card">

                    Card

                </label>


                <label class="payment-option">

                    <input
                        type="radio"
                        name="paymentMethod"
                        value="Cash on Delivery">

                    Cash on Delivery

                </label>

            </div>


            <!-- TOTAL -->

            <div class="total-box">

                <h2>
                    Total Amount
                </h2>

               <div class="total" id="totalAmount">
                  &#8377;0.00
               </div>
            </div>


            <!-- PLACE ORDER -->

            <button
                class="place-order"
                type="submit">

                Place Order

            </button>


        </form>


        <!-- BACK TO CART -->

        <a
            href="cart"
            class="back-cart">

            &#8592; Back to Cart

        </a>


    </div>

</div>

<script>

    const urlParams = new URLSearchParams(window.location.search);

    const total = urlParams.get("total");

    if (total !== null) {

        document.getElementById("totalAmount").innerHTML =
            "&#8377;" + parseFloat(total).toFixed(2);

    }

</script>


</body>

</html>

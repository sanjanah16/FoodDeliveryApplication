
<!DOCTYPE html>

<html>

<head>

<meta charset="UTF-8">
<title>Food Delivery - Login</title>

<style>

    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    body {
        font-family: Arial, sans-serif;
        min-height: 100vh;

        background: linear-gradient(
            135deg,
            #fff1e6,
            #ffe0cc,
            #fff8f2
        );

        display: flex;
        justify-content: center;
        align-items: center;
    }

    /* Main Container */

    .login-container {
        width: 900px;
        min-height: 520px;
        display: flex;
        background: white;
        border-radius: 25px;
        overflow: hidden;

        box-shadow: 0 15px 40px rgba(0, 0, 0, 0.15);
    }

    /* Left Section */

    .login-left {
        width: 45%;

        background: linear-gradient(
            135deg,
            #ff512f,
            #f09819
        );

        color: white;
        padding: 50px 40px;

        display: flex;
        flex-direction: column;
        justify-content: center;
    }

    .login-left h1 {
        font-size: 42px;
        margin-bottom: 20px;
    }

    .login-left p {
        font-size: 17px;
        line-height: 1.7;
        margin-bottom: 25px;
    }

    /* Right Section */

    .login-right {
        width: 55%;
        padding: 60px 55px;
    }

    .login-right h2 {
        color: #ff512f;
        font-size: 32px;
        margin-bottom: 8px;
    }

    .subtitle {
        color: #777;
        margin-bottom: 35px;
    }

    /* Form */

    .form-group {
        margin-bottom: 22px;
    }

    label {
        display: block;
        margin-bottom: 8px;
        font-weight: bold;
        color: #444;
    }

    input {
        width: 100%;
        padding: 14px 16px;
        border: 1px solid #ddd;
        border-radius: 10px;
        font-size: 15px;
        outline: none;
        background: #fffaf7;
        transition: 0.3s;
    }

    input:focus {
        border-color: #ff512f;

        box-shadow:
            0 0 8px
            rgba(255, 81, 47, 0.2);

        background: white;
    }

    /* Login Button */

    .login-btn {
        width: 100%;
        padding: 14px;
        margin-top: 5px;

        border: none;
        border-radius: 12px;

        background: linear-gradient(
            135deg,
            #ff512f,
            #f09819
        );

        color: white;
        font-size: 17px;
        font-weight: bold;
        cursor: pointer;
        transition: 0.3s;
    }

    .login-btn:hover {
        transform: translateY(-2px);

        box-shadow:
            0 8px 18px
            rgba(255, 81, 47, 0.3);
    }

    /* Signup Link */

    .signup-text {
        text-align: center;
        margin-top: 25px;
        color: #666;
    }

    .signup-text a {
        color: #ff512f;
        text-decoration: none;
        font-weight: bold;
    }

    .signup-text a:hover {
        text-decoration: underline;
    }

    /* Mobile */

    @media (max-width: 750px) {

        .login-container {
            width: 90%;
            flex-direction: column;
        }

        .login-left,
        .login-right {
            width: 100%;
        }

        .login-left {
            padding: 35px;
            text-align: center;
        }

        .login-left h1 {
            font-size: 32px;
        }

        .login-right {
            padding: 40px 30px;
        }
    }

</style>

</head>

<body>

<div class="login-container">

    <!-- Left Section -->

    <div class="login-left">

        <h1>Foodie</h1>

        <p>
            Welcome back! Login to explore
            delicious food from your favourite
            restaurants.
        </p>

        <p>
            Order your favourites.
            Enjoy every bite! ❤️
        </p>

    </div>


    <!-- Right Section -->

    <div class="login-right">

        <h2>Welcome Back!</h2>

        <p class="subtitle">
            Login to continue ordering your favourite food.
        </p>


        <form action="login" method="post">

            <div class="form-group">

                <label>Email</label>

                <input
                    type="email"
                    name="email"
                    placeholder="Enter your email"
                    required>

            </div>


            <div class="form-group">

                <label>Password</label>

                <input
                    type="password"
                    name="password"
                    placeholder="Enter your password"
                    required>

            </div>


            <input
                type="submit"
                value="Login"
                class="login-btn">


        </form>


        <p class="signup-text">

            Don't have an account?

            <a href="signup.html">
                Create Account
            </a>

        </p>


    </div>

</div>

</body>

</html>

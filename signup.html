<!DOCTYPE html>

<html>
<head>
    <meta charset="UTF-8">
    <title>Food Delivery - Sign Up</title>


<style>
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    body {
        font-family: Arial, sans-serif;
        min-height: 100vh;
        background: linear-gradient(135deg, #fff1e6, #ffe0cc, #fff8f2);
        display: flex;
        justify-content: center;
        align-items: center;
    }

    /* Main Container */
    .signup-container {
        width: 900px;
        min-height: 560px;
        display: flex;
        background: white;
        border-radius: 25px;
        overflow: hidden;
        box-shadow: 0 15px 40px rgba(0, 0, 0, 0.15);
    }

    /* Left Side */
    .signup-left {
        width: 45%;
        background: linear-gradient(135deg, #ff512f, #f09819);
        color: white;
        padding: 50px 40px;
        display: flex;
        flex-direction: column;
        justify-content: center;
    }

    .signup-left h1 {
        font-size: 42px;
        margin-bottom: 20px;
    }

    .signup-left p {
        font-size: 17px;
        line-height: 1.7;
        margin-bottom: 25px;
    }

    .food-icons {
        font-size: 45px;
        letter-spacing: 10px;
        margin-top: 20px;
    }

    /* Right Side */
    .signup-right {
        width: 55%;
        padding: 40px 50px;
    }

    .signup-right h2 {
        color: #ff512f;
        font-size: 30px;
        margin-bottom: 8px;
    }

    .subtitle {
        color: #777;
        margin-bottom: 25px;
    }

    /* Form */
    form {
        width: 100%;
    }

    .form-group {
        margin-bottom: 15px;
    }

    label {
        display: block;
        margin-bottom: 7px;
        font-weight: bold;
        color: #444;
    }

    input,
    select {
        width: 100%;
        padding: 13px 15px;
        border: 1px solid #ddd;
        border-radius: 10px;
        font-size: 15px;
        outline: none;
        transition: 0.3s;
        background: #fffaf7;
    }

    input:focus,
    select:focus {
        border-color: #ff512f;
        box-shadow: 0 0 8px rgba(255, 81, 47, 0.2);
        background: white;
    }

    /* Button */
    .signup-btn {
        width: 100%;
        padding: 14px;
        margin-top: 10px;
        border: none;
        border-radius: 12px;
        background: linear-gradient(135deg, #ff512f, #f09819);
        color: white;
        font-size: 17px;
        font-weight: bold;
        cursor: pointer;
        transition: 0.3s;
    }

    .signup-btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 18px rgba(255, 81, 47, 0.3);
    }

    /* Login */
    .login-text {
        text-align: center;
        margin-top: 20px;
        color: #666;
    }

    .login-text a {
        color: #ff512f;
        text-decoration: none;
        font-weight: bold;
    }

    .login-text a:hover {
        text-decoration: underline;
    }

    /* Mobile */
    @media (max-width: 750px) {
        .signup-container {
            width: 90%;
            flex-direction: column;
        }

        .signup-left,
        .signup-right {
            width: 100%;
        }

        .signup-left {
            padding: 30px;
            text-align: center;
        }

        .signup-left h1 {
            font-size: 32px;
        }

        .signup-right {
            padding: 30px;
        }
    }
</style>

</head>

<body>

```
<div class="signup-container">

    <!-- Left Section -->
    <div class="signup-left">

        <h1>🍴 Foodie</h1>

        <p>
            Create your account and discover delicious
            food from your favourite restaurants.
        </p>

        <p>
            Fresh food. Fast delivery. Happy moments! ❤️
        </p>

        <div class="food-icons">
            🍕 🍔 🍜 🍰
        </div>

    </div>


    <!-- Right Section -->
    <div class="signup-right">

        <h2>Create Account</h2>

        <p class="subtitle">
            Join us and start ordering your favourite food!
        </p>

        <form action="signup" method="post">

            <div class="form-group">
                <label>Name</label>
                <input type="text" name="name"
                       placeholder="Enter your name" required>
            </div>

            <div class="form-group">
                <label>Email</label>
                <input type="email" name="email"
                       placeholder="Enter your email" required>
            </div>

            <div class="form-group">
                <label>Password</label>
                <input type="password" name="password"
                       placeholder="Create a password" required>
            </div>

            <div class="form-group">
                <label>Phone</label>
                <input type="text" name="phone"
                       placeholder="Enter your phone number" required>
            </div>

            <div class="form-group">
                <label>Address</label>
                <input type="text" name="adress"
                       placeholder="Enter your address" required>
            </div>

            <div class="form-group">
                <label>Role</label>
                <select name="role">
                    <option value="customer">Customer</option>
                    <option value="admin">Admin</option>
                </select>
            </div>

            <input type="submit"
                   value="Create Account 🍽️"
                   class="signup-btn">

        </form>

        <p class="login-text">
            Already have an account?
            <a href="login.html">Login here</a>
        </p>

    </div>

</div>


</body>
</html>
